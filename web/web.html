<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ultrawrapper {
            background-color: beige;
        }
        .vypln1 {
            height: 100px;
            width: 100%;
            background-color: beige;
            display: flex;
            justify-content: center;
            align-items: center; 
        }
        #tlactym {
            height: fit-content;
            width: fit-content;
            padding: 10px;
            background-color: aquamarine;
            font-size: x-large;
        }
        .vypln2 {
            height: 500px;
            width: 100%;
            background-color: beige;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #tlacstahnout {
            height: fit-content;
            width: fit-content;
            font-size: xx-large;
            color: yellow;
            background-color: rgb(3, 160, 3);
            border-radius: 50%;
            padding: 20px;
        }

        .toceniwrapper {
            width: 100%;
            overflow: hidden;
        }
        .toceni1 {
            display: flex;
            gap: 20px;
            width: max-content;
            animation: scroll 5s linear infinite;
        }
        
        .tym {
            width: 500px;
            height: 320px;
            background: #4f46e5;
            border-radius: 20px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #vysledek {
            background-color: antiquewhite;
            color: black;
            border: 1px solid grey;
        }

        @keyframes scroll {
            from {
            transform: translateX(0);
            }
            to {
            transform: translateX(-2580px);
            }
        }
    </style>
</head>
<body>
    <div class="ultrawrapper">
        <div class="vypln1">
            <button id="tlactym">Který tým je nejlepší</button>
        </div>
        <div class="toceniwrapper">
            <div class="toceni1">
                <div class="tym">tým1</div>
                <div class="tym">tým2</div>
                <div class="tym">tým3</div>
                <div class="tym">tým4</div>
                <div class="tym">tým5</div>
                <div class="tym">tým1</div>
                <div class="tym">tým2</div>
                <div class="tym">tým3</div>
                <div class="tym">tým4</div>
                <div class="tym">tým5</div>
                <div class="tym">tým1</div>
                <div class="tym">tým2</div>
                <div class="tym">tým3</div>
                <div class="tym">tým4</div>
                <div class="tym">tým5</div>
        </div>
        <div class="vypln2">
            <div id="vysledek"></div>
            <button id="tlacstahnout">Stáhnout</button>
        </div>
    </div>
    <script>
        const tlacitko = document.getElementById("tlactym");
        const vysledek = document.getElementById("vysledek");

        tlacitko.addEventListener("click", () => {
            vysledek.textContent = "Kubíkův a Rdečkův tým je nejlepší!";
        });
</script>
</body>
</html>
