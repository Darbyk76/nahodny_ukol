<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ultrawrapper {
            background-color: rgb(38, 187, 247);
        }
        .vypln1 {
            height: 100px;
            width: 100%;
            background-color: rgb(38, 187, 247);
            display: flex;
            justify-content: center;
            align-items: center; 
        }
        #tlactym {
            height: fit-content;
            width: fit-content;
            padding: 10px;
            background-color: aquamarine;
            font-size: x-large;
        }
        .vypln2 {
            height: 500px;
            width: 100%;
            background-color: rgb(38, 187, 247);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #tlacstahnout {
            height: fit-content;
            width: fit-content;
            padding: 10px;
            background-color: aquamarine;
            font-size: x-large;
            display: block;
        }

        .toceniwrapper {
            width: 100%;
            overflow: hidden;
        }
        .toceni1 {
            display: flex;
            gap: 20px;
            width: max-content;
            animation: scroll 40s linear infinite;
        }
        
        .tym {
            width: 500px;
            height: 320px;
            background: rgb(149, 248, 243);
            border-radius: 20px;
            color: rgb(42, 92, 255);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #vysledek {
            background-color: rgb(149, 248, 243);
            font-size: 50px;
            padding: 20px;
            color: rgb(42, 92, 255);
            border: 1px solid grey;
            
        }

        @keyframes scroll {
            from {
            transform: translateX(0);
            }
            to {
            transform: translateX(-2580px);
            }
        }
    </style>
</head>
<body>
    <div class="ultrawrapper">
        <div class="vypln1">
            <button id="tlactym">Který tým je nejlepší</button>
        </div>
        <div class="toceniwrapper">
            <div class="toceni1">
                <div class="tym">tým1</div>
                <div class="tym">tým2</div>
                <div class="tym">tým3</div>
                <div class="tym">tým4</div>
                <div class="tym">tým5</div>
                <div class="tym">tým1</div>
                <div class="tym">tým2</div>
                <div class="tym">tým3</div>
                <div class="tym">tým4</div>
                <div class="tym">tým5</div>
                <div class="tym">tým1</div>
                <div class="tym">tým2</div>
                <div class="tym">tým3</div>
                <div class="tym">tým4</div>
                <div class="tym">tým5</div>
        </div>
        <div class="vypln2">
            <div id="vysledek"></div>

            <br><button id="tlacstahnout" onclick="stahnout()">Stáhnout</button>
        </div>
    </div>
    <script>
        const tlacitko = document.getElementById("tlactym");
        const vysledek = document.getElementById("vysledek");

        tlacitko.addEventListener("click", () => {
            vysledek.textContent = "Kubíkův a Rdečkův tým je nejlepší!";
        });
        function stahnout() {
        const a = document.createElement("a");
        a.href = "../python/sifra.py";
        a.download = "sifra.py";
        a.click();
        }
</script>
</body>
</html>
